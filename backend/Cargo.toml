[package]
name = "derniere-chance-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4.11"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
rust_decimal = { version = "1.42", features = ["serde-with-str"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Auth
jsonwebtoken = { version = "10.4", default-features = false, features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19"
# OAuth (MCP server): PKCE (S256) verification, refresh token hashing, redirect building
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2.1"

# Utilities
uuid = { version = "1.23", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"

# Outbound event notifications (webhook -> n8n -> email, see infrastructure::notifications)
reqwest = { version = "0.12", features = ["json"] }

# Emails aux abonnés : relais SMTP (voir infrastructure::email::SmtpEmailSender).
# native-tls comme sqlx et reqwest, pour n'embarquer qu'une pile TLS.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }

# Photo storage (S3/MinIO)
actix-multipart = "0.8"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

[dev-dependencies]
rust_decimal_macros = "1.40"
