# Rétention des journaux système - DernièreChance (RGPD)
#
# Sans limite de temps, journald ne purge qu'au volume (10% du système de
# fichiers par défaut), ce qui revient à une conservation indéfinie sur un
# serveur peu bavard. Or le journal contient auth.log, sshd, les décisions
# Fail2ban et les unités Suricata/CrowdSec, donc des adresses IP : des
# données personnelles au sens du RGPD.
#
# 30 jours : assez pour investiguer un incident de sécurité, pas plus.
# Voir docs/rgpd/registre-traitements.md.

[Journal]
MaxRetentionSec=30day
# Filet de sécurité en volume, pour qu'un pic de trafic ne remplisse pas le
# disque avant que la limite de temps ne s'applique.
SystemMaxUse=500M
