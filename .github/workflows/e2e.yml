name: E2E (Playwright)

# Parcours complet marchand/consommateur/admin contre la stack dev complète
# (postgres, minio, backend, frontend Astro dev server) - voir e2e/README.md.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Create shared Traefik network
        # Compose valide tous les réseaux déclarés dans le fichier même pour
        # un profil qui ne les utilise pas - le prod frontend référence le
        # réseau Traefik partagé (externe, absent en CI).
        run: docker network create ecosolva-web

      - name: Start dev stack
        run: docker compose --profile dev up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "backend never became healthy" >&2
          docker compose logs backend-dev
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4322/feed > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "frontend never became ready" >&2
          docker compose logs frontend-dev
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: e2e/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend-dev --tail 200
