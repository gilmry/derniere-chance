server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives, sans schéma ni hôte.
    #
    # Nginx tourne derrière Traefik et ne voit que du HTTP : ses redirections
    # absolues renvoyaient donc « http://... ». Or les liens du produit portent
    # des paramètres dans la query string, dont le jeton de réinitialisation de
    # mot de passe. Une redirection vers http faisait traverser ce jeton en
    # clair avant que Traefik ne relève la connexion en HTTPS. Une Location
    # relative laisse le navigateur conserver le schéma en cours.
    absolute_redirect off;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Service worker must never be long-term cached, or offline updates get stuck.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
